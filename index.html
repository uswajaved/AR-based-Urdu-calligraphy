<!DOCTYPE html>
<html>
  <head>
    <title>AR Test</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      .a-enter-vr { display: none; }
      /* This forces A-Frame to listen to the screen size correctly */
      .a-canvas { z-index: 0 !important; } 
    </style>
  </head>
  <body>
    
    <!-- No wrapper divs! Just the raw scene -->
    <a-scene 
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;" 
      renderer="logarithmicDepthBuffer: true; colorManagement: true;"
      vr-mode-ui="enabled: false"
      embedded>

      <a-marker preset="hiro" id="marker">
        <!-- A simple red box -->
        <a-box position="0 0.5 0" scale="1 1 1" color="#FF0000"></a-box>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
