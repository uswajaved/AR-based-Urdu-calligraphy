<!DOCTYPE html>
<html>
  <head>
    <title>Urdu Calligraphy AR</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" href="styles.css">
    <!-- Unblock scene.hasLoaded if a-assets hang, so enterAR() can run from a user tap. -->
    <script>
      (function () {
        function forceSceneReady() {
          var scene = document.querySelector('a-scene');
          var assets = document.querySelector('a-assets');
          try {
            if (assets && !assets.hasLoaded && typeof assets.load === 'function') {
              assets.load();
            }
          } catch (e) {}
          if (scene && !scene.hasLoaded) {
            if (typeof scene.play === 'function') {
              try { scene.play(); } catch (e) {}
            }
            scene.hasLoaded = true;
            if (typeof scene.emit === 'function') scene.emit('loaded');
          }
        }
        function boot() {
          var scene = document.querySelector('a-scene');
          if (!scene) return;
          scene.addEventListener('a-assets-loaded', function () {
            if (!scene.hasLoaded) forceSceneReady();
          });
          var assets = document.querySelector('a-assets');
          if (assets) assets.addEventListener('timeout', forceSceneReady);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot);
        } else {
          boot();
        }
      })();
    </script>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <!-- Registers xr-pen-feed before <a-scene> is parsed -->
    <script src="js/pen-tracking.js?v=20260830c"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <video id="cam-video" autoplay playsinline muted></video>

    <!-- 1. A-FRAME SCENE (WebXR hit-test, no markers) -->
    <!--
      webxr optionalFeatures (never requiredFeatures — camera-access is device-limited):
        - hit-test      -> real-world surface detection
        - local-floor   -> floor-relative reference space
        - dom-overlay   -> HTML nav/modals during AR
        - camera-access -> pen tracing feed (optional; fail soft if unsupported)
    -->
    <a-scene
      webxr="optionalFeatures: hit-test, local-floor, dom-overlay, camera-access; overlayElement: #dom-overlay;"
      ar-hit-test="target: #letter-anchor"
      xr-pen-feed
      renderer="colorManagement: true; alpha: true; physicallyCorrectLights: true;"
      xr-mode-ui="XRMode: ar"
      loading-screen="enabled: false">

      <a-assets timeout="2000">
        <!-- Only files that exist in this folder. Alif.svg / Place.svg are NOT
             in the repo and must not block scene.hasLoaded. Baa.svg is. -->
        <img id="baa-img" src="Baa.svg">
        <!-- 1×1 transparent PNG: second textured mesh so Chrome camera-access
             does not replace the only visible letter texture with the camera feed. -->
        <img id="cam-access-dummy-tex" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
      </a-assets>

      <!-- The placed letter. Hidden until the user taps to anchor it in place. -->
      <a-entity id="letter-anchor" visible="false">
        <a-image
          id="urdu-letter"
          src="#baa-img"
          position="0 0.01 0"
          scale="0.3 0.3 0.3"
          rotation="-90 0 0"
          side="double"
          material="shader: flat; transparent: true; opacity: 0.5;">
        </a-image>
      </a-entity>

      <!-- Always present second texture (tiny, off to the side). Visible only in AR. -->
      <a-image
        id="cam-access-dummy"
        src="#cam-access-dummy-tex"
        position="0 -100 0"
        scale="0.001 0.001 0.001"
        visible="false"
        material="shader: flat; transparent: true; opacity: 0.01;">
      </a-image>

      <a-entity id="camera" camera></a-entity>
    </a-scene>

    <!-- 2. HOME SCREEN -->

      </div>
    </div>

    <!-- 3. AR NAVIGATION (dom-overlay content — must live inside #dom-overlay
         so it stays visible/interactive during the immersive-ar session) -->
    <div id="dom-overlay">
      <!-- Must live inside dom-overlay or WebXR hides them during immersive AR -->
      <canvas id="tracking-canvas"></canvas>
      <div id="pen-debug-panel" aria-hidden="false"></div>
      <div id="place-hint">Move your phone to find a surface, then tap to place</div>

        </div>

      </div>

      <!-- Bottom Nav (Icons + Text) -->
      <div id="bottom-nav">
        <button class="nav-btn" onclick="goHome()">
          <img src="Home.svg" class="nav-icon">
          <span>HOME</span>
        </button>
        <button class="nav-btn" onclick="resetPlacement()">
          <!-- Place.svg is not in the repo; inline pin icon as fallback -->
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21s7-4.5 7-11a7 7 0 1 0-14 0c0 6.5 7 11 7 11z"></path>
            <circle cx="12" cy="10" r="2.5"></circle>
          </svg>
          <span>PLACE</span>
        </button>
        <button class="nav-btn" onclick="openModal('zoom-modal')">

          <span>ZOOM</span>
        </button>
        <button class="nav-btn" onclick="openModal('opacity-modal')">

        </button>

      <!-- 4. MODALS -->
      <div class="modal-overlay" id="zoom-modal">
        <div class="modal-card">
          <span class="close-x" onclick="closeModal('zoom-modal')">&times;</span>
          <div class="modal-title">Choose a zoom level</div>
          <input type="range" id="zoom-slider" min="0.5" max="3" step="0.1" value="1" oninput="updateZoomPreview(this.value)">
          <div class="preset-btns">
            <button onclick="setZoom(1)">1x</button>
            <button onclick="setZoom(1.5)">1.5x</button>
            <button onclick="setZoom(2)">2x</button>
            <button onclick="setZoom(2.5)">2.5x</button>
          </div>
          <button class="continue-btn" onclick="closeModal('zoom-modal')">CONTINUE</button>
        </div>

      <div class="modal-overlay" id="opacity-modal">

          <div class="modal-title">Choose opacity level</div>

          </div>

        </div>
      </div>
