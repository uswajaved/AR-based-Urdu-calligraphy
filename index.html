<!DOCTYPE html>
<html>
  <head>
    <title>AR Letter Tracking</title>
    <!-- Import A-Frame (our Three.js wrapper) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Import AR.js (handles the WebXR camera tracking) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      .a-enter-vr { display: none; } /* Hide default AR button, we will trigger automatically */
    </style>
  </head>
  <body>
    <!-- 
      arjs="sourceType: webcam;" tells the app to use the phone camera.
      renderer="logarithmicDepthBuffer: true;" helps prevent 3D z-fighting glitches.
    -->
    <a-scene 
      arjs="sourceType: webcam; debugUIEnabled: false;" 
      renderer="logarithmicDepthBuffer: true; colorManagement: true;"
      vr-mode-ui="enabled: false">

      <!-- This is our AR camera. It sees the real world. -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
