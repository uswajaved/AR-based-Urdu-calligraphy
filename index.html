<!DOCTYPE html>
<html>
  <head>
    <title>AR Letter Tracking</title>
    <!-- Import A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Import AR.js using a reliable CDN link -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      .a-enter-vr { display: none; } 
    </style>
  </head>
  <body>
    <a-scene 
      arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.5; trackingMethod: best;" 
      renderer="logarithmicDepthBuffer: true; colorManagement: true;"
      vr-mode-ui="enabled: false">

      <!-- Using Hiro marker for now -->
      <a-marker preset="hiro" id="marker">
        
        <!-- The glowing cyan line (standing straight up) -->
        <a-entity 
          line="start: 0, 0, 0; end: 0, 2, 0; color: #00FFFF; opacity: 0.8"
          material="shader: standard; emissive: #00FFFF; emissiveIntensity: 2; transparent: true; opacity: 0.8">
        </a-entity>

        <!-- THE IMAGE LYING FLAT ON THE MARKER -->
        <a-image 
          src="Alif.png" 
          position="0 0.01 0" 
          scale="1 1 1" 
          rotation="-90 0 0"
          side="double"
          material="transparent: true; opacity: 0.9">
        </a-image>

      </a-marker>

      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
