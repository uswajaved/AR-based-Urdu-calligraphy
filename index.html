<!DOCTYPE html>
<html>
  <head>
    <title>Urdu Calligraphy AR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      .a-enter-vr { display: none; } 

      /* --- HOME SCREEN --- */
      #home-screen {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: white; z-index: 200; display: flex; flex-direction: column;
        align-items: center; padding-top: 40px;
      }
      .tab-header { display: flex; gap: 20px; margin-bottom: 20px; font-weight: bold; font-size: 18px; }
      .tab-header span { cursor: pointer; color: #999; }
      .tab-header span.active { color: #000; border-bottom: 2px solid #000; }
      .letter-grid {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
        width: 90%; max-width: 400px;
      }
      .letter-box {
        background: #f0f0f0; aspect-ratio: 1; display: flex; align-items: center;
        justify-content: center; font-size: 32px; cursor: pointer; border-radius: 8px;
        color: black; font-weight: bold;
      }
      .letter-box:hover { background: #ddd; }

      /* --- AR VIEW & BOTTOM NAV --- */
      #ar-view { display: none; width: 100%; height: 100%; }
      #bottom-nav {
        position: absolute; bottom: 0; left: 0; width: 100%; height: 60px;
        background: rgba(255,255,255,0.9); display: flex; justify-content: space-around;
        align-items: center; z-index: 50; border-top: 1px solid #ccc;
      }
      .nav-btn { background: none; border: none; font-weight: bold; cursor: pointer; color: #333; font-size: 14px; }

      /* --- MODALS (Popups) --- */
      .modal-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); z-index: 150; display: none;
        justify-content: center; align-items: center;
      }
      .modal-card {
        background: white; width: 80%; max-width: 350px; border-radius: 12px;
        padding: 20px; position: relative; text-align: center;
      }
      .close-x { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #999; }
      .modal-title { font-weight: bold; font-size: 18px; margin-bottom: 20px; }
      .preset-btns { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
      .preset-btns button { padding: 8px 16px; border: 1px solid #ddd; background: white; border-radius: 6px; cursor: pointer; font-weight: bold;}
      .preset-btns button.active { background: #007bff; color: white; border-color: #007bff; }
      .continue-btn { background: #007bff; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;}
      
      /* Color Picker specific */
      .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
      .color-circle { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; margin: auto; }
      .color-circle.selected { border-color: #333; }

      /* Slider styling */
      input[type=range] { width: 100%; cursor: pointer; }
    </style>
  </head>
  <body>
    
    <!-- 1. HOME SCREEN -->
    <div id="home-screen">
      <div class="tab-header">
        <span class="active">HOME</span>
        <span>LETTERS</span>
        <span>WORDS</span>
      </div>
      <div class="letter-grid">
        <!-- We use onclick="selectLetter('FileName.png')" -->
        <div class="letter-box" onclick="selectLetter('Alif.png')">ا</div>
        <div class="letter-box" onclick="selectLetter('Baa.png')">ب</div>
        <div class="letter-box" onclick="selectLetter('Taa.png')">ت</div>
        <div class="letter-box" onclick="selectLetter('Thaa.png')">ث</div>
        <div class="letter-box" onclick="selectLetter('Jeem.png')">ج</div>
        <div class="letter-box" onclick="selectLetter('Haa.png')">ح</div>
        <div class="letter-box" onclick="selectLetter('Khaa.png')">خ</div>
        <div class="letter-box" onclick="selectLetter('Daal.png')">د</div>
        <div class="letter-box">ذ</div>
        <div class="letter-box">ر</div>
        <div class="letter-box">ز</div>
        <div class="letter-box">س</div>
        <div class="letter-box">ش</div>
        <div class="letter-box">ص</div>
        <div class="letter-box">ض</div>
        <div class="letter-box">ط</div>
      </div>
    </div>

    <!-- 2. AR VIEW -->
    <div id="ar-view">
      <a-scene 
        arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.5; trackingMethod: best;" 
        renderer="logarithmicDepthBuffer: true; colorManagement: true;"
        vr-mode-ui="enabled: false"
        embedded>

        <a-marker preset="hiro" id="marker">
          <a-image 
            id="urdu-letter"
            src="Alif.png" 
            position="0 0.01 0" 
            scale="1 1 1" 
            rotation="-90 0 0"
            side="double"
            material="transparent: true; opacity: 0.5; color: #ffffff">
          </a-image>
        </a-marker>

        <a-entity camera></a-entity>
      </a-scene>

      <!-- Bottom Navigation -->
      <div id="bottom-nav">
        <button class="nav-btn" onclick="goHome()">HOME</button>
        <button class="nav-btn" onclick="openModal('zoom-modal')">ZOOM</button>
        <button class="nav-btn" onclick="openModal('color-modal')">COLOR</button>
        <button class="nav-btn" onclick="openModal('opacity-modal')">OPACITY</button>
      </div>
    </div>

    <!-- 3. MODALS (Popups) -->

    <!-- ZOOM MODAL -->
    <div class="modal-overlay" id="zoom-modal">
      <div class="modal-card">
        <span class="close-x" onclick="closeModal('zoom-modal')">&times;</span>
        <div class="modal-title">Choose a zoom level</div>
        <input type="range" id="zoom-slider" min="0.5" max="3" step="0.1" value="1" oninput="updateZoomPreview(this.value)">
        <div class="preset-btns">
          <button onclick="setZoom(1)">1x</button>
          <button onclick="setZoom(1.5)">1.5x</button>
          <button onclick="setZoom(2)">2x</button>
          <button onclick="setZoom(2.5)">2.5x</button>
        </div>
        <button class="continue-btn" onclick="closeModal('zoom-modal')">CONTINUE</button>
      </div>
    </div>

    <!-- COLOR MODAL -->
    <div class="modal-overlay" id="color-modal">
      <div class="modal-card">
        <span class="close-x" onclick="closeModal('color-modal')">&times;</span>
        <div class="modal-title">Choose a color</div>
        <div class="color-grid">
          <div class="color-circle" style="background: #000000;" onclick="setColor('#000000')"></div>
          <div class="color-circle" style="background: #FF0000;" onclick="setColor('#FF0000')"></div>
          <div class="color-circle" style="background: #0000FF;" onclick="setColor('#0000FF')"></div>
          <div class="color-circle" style="background: #008000;" onclick="setColor('#008000')"></div>
          <div class="color-circle" style="background: #FFA500;" onclick="setColor('#FFA500')"></div>
          <div class="color-circle" style="background: #800080;" onclick="setColor('#800080')"></div>
          <div class="color-circle" style="background: #FFC0CB;" onclick="setColor('#FFC0CB')"></div>
          <div class="color-circle" style="background: #FFFFFF; border: 1px solid #ccc;" onclick="setColor('#FFFFFF')"></div>
        </div>
        <button class="continue-btn" onclick="closeModal('color-modal')">CONTINUE</button>
      </div>
    </div>

    <!-- OPACITY MODAL -->
    <div class="modal-overlay" id="opacity-modal">
      <div class="modal-card">
        <span class="close-x" onclick="closeModal('opacity-modal')">&times;</span>
        <div class="modal-title">Choose opacity level</div>
        <input type="range" id="opacity-slider" min="0.1" max="1" step="0.1" value="0.5" oninput="updateOpacityPreview(this.value)">
        <div class="preset-btns">
          <button onclick="setOpacity(0.25)">25</button>
          <button onclick="setOpacity(0.50)">50</button>
          <button onclick="setOpacity(0.75)">75</button>
          <button onclick="setOpacity(1.0)">100</button>
        </div>
        <button class="continue-btn" onclick="closeModal('opacity-modal')">CONTINUE</button>
      </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
      let currentZoom = 1;
      let currentOpacity = 0.5;
      let currentColor = '#ffffff';

      // Apply settings to the 3D object
      function applySettings() {
        let letterEl = document.querySelector('#urdu-letter');
        letterEl.setAttribute('scale', currentZoom + ' ' + currentZoom + ' 1');
        letterEl.setAttribute('material', 'transparent: true; opacity: ' + currentOpacity + '; color: ' + currentColor);
      }

      // Home Screen Logic
      function selectLetter(filename) {
        document.querySelector('#urdu-letter').setAttribute('src', filename);
        document.querySelector('#home-screen').style.display = 'none';
        document.querySelector('#ar-view').style.display = 'block';
      }

      function goHome() {
        document.querySelector('#ar-view').style.display = 'none';
        document.querySelector('#home-screen').style.display = 'flex';
      }

      // Modal Logic
      function openModal(id) { document.getElementById(id).style.display = 'flex'; }
      function closeModal(id) { 
        document.getElementById(id).style.display = 'none'; 
        applySettings(); 
      }

      // Zoom Logic
      function updateZoomPreview(val) { currentZoom = parseFloat(val); }
      function setZoom(val) {
        currentZoom = val;
        document.getElementById('zoom-slider').value = val;
      }

      // Opacity Logic
      function updateOpacityPreview(val) { currentOpacity = parseFloat(val); }
      function setOpacity(val) {
        currentOpacity = val;
        document.getElementById('opacity-slider').value = val;
      }

      // Color Logic
      function setColor(hex) {
        currentColor = hex;
        // Highlight selected circle
        let circles = document.querySelectorAll('.color-circle');
        circles.forEach(c => c.classList.remove('selected'));
        event.target.classList.add('selected');
      }
    </script>

  </body>
</html>
