<!DOCTYPE html>
<html>
  <head>
    <title>Urdu Calligraphy AR - Pen Tracking</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MediaPipe Hands Solution -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: black; }
      .a-canvas { z-index: 2 !important; background: transparent !important; }
      
      /* Layers (z-index ordering is critical) */
      #camera-feed { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transform: scaleX(-1); /* Mirror */ }
      #feedback-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; transform: scaleX(-1); /* Mirror */ }
      
      #ui-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
      #hint { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 20px; display: block; }
    </style>
  </head>
  <body>

    <!-- 1. HTML5 Camera Video Background -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- 2. 2D Canvas for Pen Tracking & Feedback -->
    <canvas id="feedback-canvas"></canvas>

    <!-- 3. A-Frame Scene (Renders the 3D Ghost Letter) -->
    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; colorManagement: true;">
      <a-assets>
        <img id="alif-img" src="Alif.svg" crossorigin="anonymous">
      </a-assets>
      <!-- Letter is fixed to the camera (HUD style) so it aligns with the 2D canvas -->
      <a-entity camera>
        <a-entity id="letter-anchor" position="0 0 -1.5" rotation="-90 0 0" scale="0.5 0.5 0.5">
          <a-image id="urdu-letter" src="#alif-img" material="shader: flat; transparent: true; opacity: 0.2; side: double;"></a-image>
        </a-entity>
      </a-entity>
    </a-scene>

    <!-- 4. UI Overlay -->
    <div id="ui-overlay">
      <div id="hint">Show your index finger to the camera to start tracing!</div>
    </div>

    <script>
      // --- 1. Setup Canvas & Camera ---
      const videoElement = document.getElementById('camera-feed');
      const canvas = document.getElementById('feedback-canvas');
      const ctx = canvas.getContext('2d');
      const hintEl = document.getElementById('hint');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          videoElement.srcObject = stream;
        } catch (err) { console.error("Camera error:", err); }
      }

      // --- 2. Define the "Correct Path" (Target Trajectory) ---
      // For demonstration, we define a simple straight line from Top to Bottom (like Alif).
      // Coordinates are normalized (0 to 1). We will scale them to the screen.
      const targetPath = [
        { x: 0.5, y: 0.2 }, // Start point
        { x: 0.5, y: 0.8 }  // End point
      ];
      let userTrail = []; // Stores the user's finger path
      let lastPoint = null;

      // --- 3. Comparison Logic ---
      function checkFeedback(currX, currY) {
        let isOnPath = false;
        let correctDirection = true; // Assume true for now
        
        // A. Check Proximity (Is the pen near the line?)
        // Simple math: distance from point to the line segment
        // For this example, we check if X is roughly in the middle of the screen
        if (currX > 0.45 && currX < 0.55) {
          isOnPath = true;
        }

        // B. Check Direction (Are they moving downwards?)
        if (lastPoint) {
          if (currY < lastPoint.y) {
            correctDirection = false; // Moving upwards is wrong for Alif
          }
        }
        lastPoint = { x: currX, y: currY };

        // C. Return Feedback State
        if (!isOnPath) return 'red';      // Off track
        if (!correctDirection) return 'yellow'; // Wrong direction
        return 'green';                   // Perfect
      }

      // --- 4. MediaPipe Processing ---
      function onResults(results) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw Target Path (White ghost line)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 5;
        const start = { x: targetPath[0].x * canvas.width, y: targetPath[0].y * canvas.height };
        const end = { x: targetPath[1].x * canvas.width, y: targetPath[1].y * canvas.height };
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          hintEl.style.display = 'none';
          
          // Index finger tip is Landmark 8 in MediaPipe
          const indexTip = results.multiHandLandmarks[0][8];
          const screenX = indexTip.x * canvas.width;
          const screenY = indexTip.y * canvas.height;

          // Run comparison logic
          const feedbackColor = checkFeedback(indexTip.x, indexTip.y);
          
          // Add to user trail
          userTrail.push({ x: screenX, y: screenY, color: feedbackColor });
          if (userTrail.length > 50) userTrail.shift(); // Limit trail length

          // Draw User Trail
          userTrail.forEach((pt, index) => {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = pt.color;
            ctx.fill();
          });

          // Draw "Pen Tip" (Trackable dot)
          ctx.beginPath();
          ctx.arc(screenX, screenY, 15, 0, Math.PI * 2);
          ctx.fillStyle = feedbackColor;
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'white';
          ctx.stroke();

        } else {
          hintEl.style.display = 'block';
          hintEl.textContent = 'Searching for hand...';
          lastPoint = null; // Reset direction tracking if hand disappears
        }
      }

      // --- 5. Initialize MediaPipe Hands ---
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.5
      });
      hands.onResults(onResults);

      // Start camera and feed it to MediaPipe
      startCamera().then(() => {
        const camera = new Camera(videoElement, {
          onFrame: async () => { await hands.send({ image: videoElement }); },
          width: 1280, height: 720
        });
        camera.start();
      });

    </script>
  </body>
</html>
