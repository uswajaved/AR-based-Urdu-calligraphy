<!DOCTYPE html>
<html>
  <head>
    <title>Urdu Calligraphy AR - Pen Tracking</title>
    <!-- We removed A-Frame. Only MediaPipe is needed now! -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: black; }
      
      /* Layers */
      #camera-feed { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        object-fit: cover; z-index: 0; 
        transform: scaleX(-1); /* Mirror for selfie view */
      }
      
      #ghost-letter { 
        position: fixed; top: 50%; left: 50%; 
        transform: translate(-50%, -50%) scaleX(-1); /* Center and mirror to match video */
        height: 40%; width: auto; opacity: 0.2; z-index: 1; 
        pointer-events: none;
      }
      
      #feedback-canvas { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        z-index: 2; pointer-events: none; 
        transform: scaleX(-1); /* Match video mirroring */
      }
      
      #ui-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
      #hint { 
        position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
        background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; 
        border-radius: 20px; display: block; font-weight: bold; 
      }
    </style>
  </head>
  <body>

    <!-- 1. HTML5 Camera Video Background -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- 2. The 2D Ghost Letter to trace -->
    <img id="ghost-letter" src="Alif.svg" alt="Urdu Letter">

    <!-- 3. 2D Canvas for Pen Tracking & Feedback -->
    <canvas id="feedback-canvas"></canvas>

    <!-- 4. UI Overlay -->
    <div id="ui-overlay">
      <div id="hint">Initializing camera...</div>
    </div>

    <script>
      const videoElement = document.getElementById('camera-feed');
      const canvas = document.getElementById('feedback-canvas');
      const ctx = canvas.getContext('2d');
      const hintEl = document.getElementById('hint');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // --- Robust Camera Initialization ---
      async function startCamera() {
        let stream;
        try {
          // Try to get the back camera
          stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: { ideal: "environment" } } 
          });
        } catch (e) {
          console.error("Back camera failed, trying default camera...", e);
          try {
            // Fallback to ANY camera (usually front camera on phones)
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
          } catch (e2) {
            alert("Camera Access Failed: " + e2.name + "\nPlease ensure no other apps are using the camera and you have granted browser permissions.");
            hintEl.textContent = "Camera Access Denied";
            return;
          }
        }
        
        videoElement.srcObject = stream;
        videoElement.play();
        hintEl.textContent = "Show your index finger to the camera to start tracing!";
        
        // Start the MediaPipe loop
        requestAnimationFrame(loop);
      }

      // --- Comparison Logic ---
      const targetPath = [
        { x: 0.5, y: 0.3 }, // Start point (Top of Alif)
        { x: 0.5, y: 0.7 }  // End point (Bottom of Alif)
      ];
      let userTrail = [];
      let lastPoint = null;

      function checkFeedback(currX, currY) {
        let isOnPath = false;
        let correctDirection = true;
        
        // A. Check Proximity (Is the pen near the center line?)
        if (currX > 0.42 && currX < 0.58) {
          isOnPath = true;
        }

        // B. Check Direction (Are they moving downwards?)
        if (lastPoint) {
          if (currY < lastPoint.y) {
            correctDirection = false; // Moving upwards is wrong for Alif
          }
        }
        lastPoint = { x: currX, y: currY };

        // C. Return Feedback State
        if (!isOnPath) return 'red';      // Off track
        if (!correctDirection) return 'yellow'; // Wrong direction
        return 'green';                   // Perfect
      }

      // --- MediaPipe Processing ---
      function onResults(results) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw Target Path (White ghost line)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 8;
        const start = { x: targetPath[0].x * canvas.width, y: targetPath[0].y * canvas.height };
        const end = { x: targetPath[1].x * canvas.width, y: targetPath[1].y * canvas.height };
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          hintEl.style.display = 'none';
          
          // Index finger tip is Landmark 8
          const indexTip = results.multiHandLandmarks[0][8];
          const screenX = indexTip.x * canvas.width;
          const screenY = indexTip.y * canvas.height;

          // Run comparison logic
          const feedbackColor = checkFeedback(indexTip.x, indexTip.y);
          
          // Add to user trail
          userTrail.push({ x: screenX, y: screenY, color: feedbackColor });
          if (userTrail.length > 60) userTrail.shift(); // Limit trail length

          // Draw User Trail
          userTrail.forEach((pt, index) => {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = pt.color;
            ctx.fill();
          });

          // Draw "Pen Tip" (Trackable dot)
          ctx.beginPath();
          ctx.arc(screenX, screenY, 12, 0, Math.PI * 2);
          ctx.fillStyle = feedbackColor;
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'white';
          ctx.stroke();

        } else {
          hintEl.style.display = 'block';
          hintEl.textContent = 'Searching for hand...';
          lastPoint = null; // Reset direction tracking if hand disappears
        }
      }

      // --- Initialize MediaPipe Hands ---
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0, // Use Lite model for budget phones
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5
      });
      hands.onResults(onResults);

      // --- The Loop ---
      // We send the video frame to MediaPipe manually
      async function loop() {
        if (videoElement.readyState >= 2) {
          await hands.send({ image: videoElement });
        }
        requestAnimationFrame(loop);
      }

      // Start everything!
      startCamera();

    </script>
  </body>
</html>
